/**:
  ros__parameters:
    motor_topic: /rov/motor_rpm
    command_rate_hz: 20.0
    # Maximum motor-shaft RPM per wheel.
    max_motor_rpm: [300.0, 300.0, 300.0, 300.0]

rover_velocity_rpm:
  ros__parameters:
    command_topic: /rov_cmd_vel
    # Existing dimensions: radius 63.5 mm, lengths 205 mm and 170 mm.
    wheel_radius_m: 0.0635
    half_length_m: 0.205
    half_width_m: 0.170
    gear_ratios: [1.0, 1.0, 1.0, 1.0]
    twist_timeout_sec: 0.5

cmd_roboteq_rpm:
  ros__parameters:
    deadman_topic: /deadman
    front_port: /dev/roboteq_1
    back_port: /dev/roboteq_2
    baudrate: 115200
    motor_directions: [-1, -1, -1, -1]
    rpm_timeout_sec: 0.5
