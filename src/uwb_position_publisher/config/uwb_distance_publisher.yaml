uwb_distance_publisher:
  ros__parameters:
    serial_port: "/dev/ttyACM1"
    serial_port_candidates:
      - "/dev/ttyACM1"
      - "/dev/ttyACM2"
      - "/dev/ttyACM0"
    serial_probe_lines: 5
    baudrate: 115200
    read_timeout: 0.1
    reconnect_interval: 1.0
    invalid_distance_cm: 65535
    frame_id: "uwb"
    timer_period: 0.01
