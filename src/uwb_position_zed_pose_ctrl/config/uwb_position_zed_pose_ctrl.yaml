uwb_position_zed_pose_ctrl:
  ros__parameters:
    uwb_position_topic: /uwb/position
    zed_heading_topic: /zed/heading
    cmd_vel_topic: /rov_cmd_vel

    target_x: -1.0
    target_y: -1.0
    target_yaw: 0.0

    x_tolerance: 0.05
    y_tolerance: 0.05
    yaw_tolerance: 0.05

    kp_x: 0.4
    kp_y: 0.4
    kp_yaw: 0.8

    min_linear_speed: 0.0
    max_linear_speed: 0.5
    min_angular_speed: 0.0
    max_angular_speed: 0.5

    position_timeout: 0.5
    heading_timeout: 0.5
    control_rate: 20.0
