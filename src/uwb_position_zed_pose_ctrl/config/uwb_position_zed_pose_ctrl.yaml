uwb_position_zed_pose_ctrl:
  ros__parameters:
    robot_pose_topic: /uwb/robot_pose
    world_frame_id: world
    cmd_vel_topic: /rov_cmd_vel

    target_x: -1.0
    target_y: -1.0
    # Heading convention retained: 0 = world +Y, positive = counterclockwise.
    target_yaw: 0.0

    # Body-frame position tolerances [m]: x = forward/back, y = lateral.
    x_tolerance: 0.05
    y_tolerance: 0.05
    yaw_tolerance: 0.05

    kp_x: 0.4
    kp_y: 0.4
    kp_yaw: 0.05

    min_linear_speed: 0.3
    max_linear_speed: 0.5
    min_angular_speed: 0.0
    max_angular_speed: 0.5

    pose_timeout: 0.5
    control_rate: 20.0
